<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Outil interne — Filigrane documents</title>
<style>
  body{font-family:'Segoe UI',sans-serif;background:#1B2229;color:#EDE6DA;
    max-width:480px;margin:40px auto;padding:24px;}
  h1{font-size:1.3rem;margin-bottom:6px;}
  p.sub{color:#9CA6AD;font-size:.88rem;margin-bottom:28px;}
  label{display:block;font-size:.85rem;margin-bottom:6px;color:#C9C2B6;}
  input[type="text"], input[type="file"], input[type="url"]{
    width:100%;padding:11px 13px;border-radius:8px;border:1px solid rgba(237,230,218,.15);
    background:#232C35;color:#EDE6DA;margin-bottom:18px;font-size:.92rem;
  }
  button{
    width:100%;padding:13px;border:none;border-radius:8px;background:#16a868;
    color:#fff;font-weight:600;cursor:pointer;font-size:.95rem;
  }
  button:disabled{opacity:.5;cursor:not-allowed;}
  .msg{margin-top:16px;font-size:.85rem;text-align:center;min-height:20px;}
  .msg.error{color:#e08a7a;}
  .msg.success{color:#8fbf8a;}
  .warning{
    background:rgba(192,133,82,.15);border:1px solid rgba(192,133,82,.3);
    border-radius:8px;padding:12px 14px;font-size:.8rem;color:#D9A876;margin-bottom:24px;
  }
  #qr-canvas{display:none;}
</style>
</head>
<body>

<h1>🔒 Outil interne — Filigrane documents</h1>
<p class="sub">Réservé au personnel. Ajoute le nom de l'élève + un QR code vers le site sur chaque document avant l'envoi dans un groupe.</p>

<div class="warning">
  Cette page n'est pas référencée et n'est liée nulle part sur le site public. Ne partage jamais son lien.
</div>

<label>Document PDF à protéger</label>
<input type="file" id="pdf-file" accept="application/pdf">

<label>Nom complet de l'élève (apparaîtra en discret sur le document)</label>
<input type="text" id="nom-eleve" placeholder="Ex: Kouassi Awa">

<label>Lien du site (destination du QR code)</label>
<input type="url" id="lien-site" value="https://ensemble-pour-reussir.netlify.app/">

<button id="generer-btn">Générer le document filigrané</button>
<div class="msg" id="msg"></div>

<canvas id="qr-canvas"></canvas>

<script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
<script>
document.getElementById('generer-btn').addEventListener('click', async () => {
  const fileInput = document.getElementById('pdf-file');
  const nomEleve = document.getElementById('nom-eleve').value.trim();
  const lienSite = document.getElementById('lien-site').value.trim();
  const msg = document.getElementById('msg');
  const btn = document.getElementById('generer-btn');

  msg.textContent = '';
  msg.className = 'msg';

  if (!fileInput.files.length) {
    msg.textContent = "❌ Choisis un fichier PDF.";
    msg.classList.add('error');
    return;
  }
  if (!nomEleve) {
    msg.textContent = "❌ Renseigne le nom de l'élève.";
    msg.classList.add('error');
    return;
  }
  if (!lienSite) {
    msg.textContent = "❌ Renseigne le lien du site pour le QR code.";
    msg.classList.add('error');
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Traitement en cours…';

  try {
    const { PDFDocument, rgb } = PDFLib;
    const fileBytes = await fileInput.files[0].arrayBuffer();
    const pdfDoc = await PDFDocument.load(fileBytes, { ignoreEncryption: true });
    const pages = pdfDoc.getPages();

    const dateCode = new Date().toISOString().slice(0, 10).replace(/-/g, '');
    const codeInterne = btoa(nomEleve + '|' + dateCode).slice(0, 10);
    const texteFiligrane = nomEleve + " — " + codeInterne;

    const canvas = document.getElementById('qr-canvas');
    await QRCode.toCanvas(canvas, lienSite, { width: 120, margin: 1 });
    const qrDataUrl = canvas.toDataURL('image/png');
    const qrImageBytes = await fetch(qrDataUrl).then(res => res.arrayBuffer());
    const qrImage = await pdfDoc.embedPng(qrImageBytes);
    const qrSize = 42;

    pages.forEach(page => {
      const { width } = page.getSize();

      page.drawText(texteFiligrane, {
        x: width - 160,
        y: 20,
        size: 6,
        color: rgb(0.82, 0.82, 0.82),
      });

      page.drawImage(qrImage, {
        x: width - qrSize - 14,
        y: 26,
        width: qrSize,
        height: qrSize,
        opacity: 0.85,
      });
    });

    const pdfBytes = await pdfDoc.save();
    const blob = new Blob([pdfBytes], { type: 'application/pdf' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'document-protege.pdf';
    a.click();

    msg.textContent = "✅ Document généré. Code interne : " + codeInterne;
    msg.classList.add('success');
  } catch (err) {
    console.error(err);
    msg.textContent = "❌ Erreur : " + (err.message || "fichier invalide");
    msg.classList.add('error');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Générer le document filigrané';
  }
});
</script>

</body>
</html>
